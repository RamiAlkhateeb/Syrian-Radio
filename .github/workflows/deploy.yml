name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NinarFmPlayer.csproj

      - name: Stamp version manifest
        # Nxt.UI's update banner compares this with the version the browser last ran.
        run: printf '{"version":"%s"}\n' "${{ github.sha }}" > wwwroot/version.json

      - name: Publish Blazor WebAssembly app
        run: dotnet publish NinarFmPlayer.csproj -c Release --no-restore -o publish

      - name: Deploy to Cloudflare Pages
        env:
          WRANGLER_LOG: debug
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy publish/wwwroot --project-name=syrian-radio
